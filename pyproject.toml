[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomoax"
version = "0.2.0"
description = "Morphological, transcriptional and genetic perturbation representations"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.1,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "h5py>=3.10,<4", "scikit-learn>=1.5,<2", "tqdm>=4.66", "matplotlib>=3.8", "joblib>=1.3"]

[project.optional-dependencies]
reproduce = ["PyMuPDF>=1.24.2,<2", "scipy>=1.11,<2", "Pillow>=10"]
visualization = ["umap-learn>=0.5", "networkx>=3", "pillow>=10"]

[project.scripts]
biomoax = "biomoax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biomoax = ["training/*.py"]
