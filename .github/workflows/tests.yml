name: CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[reproduce]'
      - run: python -m unittest discover -s tests -v
      - run: python examples/synthetic_retrieval.py
      - run: python pipelines/test_shell_workflow.py
      - run: python reproduce/run.py statistics
